<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Cotizador</title>
<link rel="icon" type="image/png" sizes="96x96" href="ico/favicon-96x96.png">
<link rel="shortcut icon" href="ico/favicon.ico">
<link rel="apple-touch-icon" href="ico/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="top">
  <script src="menu.js"></script>
  <div id="mode">
    <button data-a="mode" data-v="sheet" aria-label="Hojas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2h9l5 5v15H5zM14 2v5h5"/><text x="12" y="18" font-size="6.2" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">PDF</text></svg><i></i></button>
    <button data-a="mode" data-v="photo" aria-label="Fotos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg><i></i></button>
  </div>
  <button id="clear" class="ic" aria-label="Limpiar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
</div>
<div class="row"><button class="p" id="add">+ Manual</button><button class="p" id="pick">Subir archivos</button></div>
<input type="file" id="files" multiple>
<main id="items"></main>
<div class="ext">
  <label id="ringBox"><span id="ringTxt">Anillados</span><input id="ring" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label>
  <label><span>Envío</span><select id="zone"></select></label>
</div>
<div id="bar"><div>
  <span id="tot">$0</span>
  <button id="copy">Copiar</button>
  <button id="wa" class="p">WhatsApp</button>
</div></div>
<script src="app.js"></script>
</body>
</html>
